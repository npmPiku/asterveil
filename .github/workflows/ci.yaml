name: Asterveil CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-integration:
    name: Compile and test Compact contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: yarn

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Compile Compact contract and sync browser artifacts
        run: yarn compile

      - name: Run pure circuit unit tests
        run: yarn test:unit

      - name: Start local Midnight services
        run: yarn env:up

      - name: Wait for local DUST
        run: yarn wait:dust

      - name: Run integration tests
        run: yarn test:local

      - name: Stop local Midnight services
        if: always()
        run: yarn env:down

      - name: Upload service logs when tests fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asterveil-service-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Build browser application
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
